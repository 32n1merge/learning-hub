<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{COURSE_TITLE}} — Learning Hub</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <header>
    <div class="container">
      <h1><a href="/">Learning Hub</a></h1>
      <nav>
        <a href="/">← Home</a>
      </nav>
    </div>
  </header>
  
  <main class="container">
    <article class="course">
      <h1>{{COURSE_TITLE}}</h1>
      <p class="course-description">{{COURSE_DESCRIPTION}}</p>
      <div class="course-meta">
        <span>{{LESSON_COUNT_TEXT}}</span>
      </div>
      
      <section class="lessons">
        <h2>Lessons</h2>
        <ul>
          {{LESSON_LIST}}
        </ul>
      </section>
    </article>
  </main>
  
  <footer>
    <div class="container">
      <p>Learning Hub — A curated collection of Teach sessions</p>
    </div>
  </footer>
</body>
</html>
