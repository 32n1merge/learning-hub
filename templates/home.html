<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>32N1 Learn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="alternate" type="application/rss+xml" title="32N1 Learning Hub" href="/feed.xml">
  <script>
    // Theme init — run before paint to prevent flash
    (function() {
      const stored = localStorage.getItem('theme-preference');
      if (stored === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else if (!stored) {
        if (window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      }
      document.documentElement.classList.remove('no-js');
    })();
  </script>
</head>
<body class="no-js">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container">
      <a href="/" class="site-brand" aria-label="32N1 Learn Home">32N1 Learn</a>
      <nav class="site-nav" role="navigation" aria-label="Main navigation">
        <a href="/#courses-grid" class="nav-link">Courses</a>
        <a href="#topics" class="nav-link">Topics</a>
        <button class="nav-icon-btn search-toggle" aria-label="Search (⌘K)" title="Search (⌘K)" onclick="document.getElementById('search-input').focus()">
          <span aria-hidden="true">⌘K</span>
        </button>
        <button class="nav-icon-btn theme-toggle" aria-label="Toggle theme" title="Toggle theme" onclick="toggleTheme()">
          <span class="icon-dark" aria-hidden="true">🌙</span>
          <span class="icon-light" aria-hidden="true">☀️</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main-content" role="main">
    <section class="search-section" aria-label="Search courses">
      <div class="search-wrapper">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <label for="search-input" class="visually-hidden">Search courses</label>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search courses..."
          aria-label="Search courses by title, description, or tags"
        >
        <span class="search-shortcut" aria-hidden="true"><kbd>⌘</kbd><kbd>K</kbd></span>
      </div>
    </section>

    <div class="container">
      {{TOPICS_SECTION}}

      <section class="courses-grid" id="courses-grid" aria-label="Course list">
        {{COURSE_CARDS}}
      </section>

      {{RECENTLY_UPDATED}}
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <span class="footer-brand">32N1 Learn</span>
      <span>A curated collection of engineering knowledge</span>
      <span class="footer-meta"><a href="/feed.xml" class="footer-rss">RSS</a> · Powered by 32N1</span>
    </div>
  </footer>

  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = !html.hasAttribute('data-theme') || html.getAttribute('data-theme') !== 'light';
      if (isDark) {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('theme-preference', 'light');
      } else {
        html.removeAttribute('data-theme');
        localStorage.setItem('theme-preference', 'dark');
      }
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
      if (!localStorage.getItem('theme-preference')) {
        if (e.matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
      }
    });

    // Search + topic filter
    (function() {
      var input = document.getElementById('search-input');
      var grid = document.getElementById('courses-grid');
      var chipsWrap = document.querySelector('.topic-chips');
      var cards = grid ? Array.from(grid.querySelectorAll('.course-card')) : [];
      var activeTopic = '';

      function applyFilters() {
        var query = input.value.toLowerCase().trim();
        var visible = 0;

        cards.forEach(function(card) {
          var text = card.getAttribute('data-search-text') || '';
          var topics = (card.getAttribute('data-topics') || '').split(',').filter(Boolean);
          var matchQuery = !query || text.indexOf(query) !== -1;
          var matchTopic = !activeTopic || topics.indexOf(activeTopic) !== -1;
          var match = matchQuery && matchTopic;
          card.style.display = match ? '' : 'none';
          if (match) visible++;
        });

        var noResults = grid.querySelector('.no-results');
        if (visible === 0 && (query || activeTopic)) {
          if (!noResults) {
            noResults = document.createElement('div');
            noResults.className = 'no-results';
            noResults.setAttribute('role', 'status');
            grid.appendChild(noResults);
          }
          noResults.textContent = activeTopic
            ? 'No courses match this topic.'
            : 'No courses match your search.';
        } else if (noResults) {
          noResults.remove();
        }
      }

      input.addEventListener('input', applyFilters);

      if (chipsWrap) {
        chipsWrap.addEventListener('click', function(e) {
          var chip = e.target.closest('.topic-chip');
          if (!chip) return;
          activeTopic = chip.getAttribute('data-topic') || '';
          chipsWrap.querySelectorAll('.topic-chip').forEach(function(c) {
            var on = c === chip;
            c.classList.toggle('active', on);
            c.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          applyFilters();
        });
      }

      // Keyboard shortcut: ⌘K / Ctrl+K
      document.addEventListener('keydown', function(e) {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          input.focus();
          input.select();
        }
        // Arrow key navigation through visible cards
        if (document.activeElement === input && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
          e.preventDefault();
          var visibleCards = cards.filter(function(c) { return c.style.display !== 'none'; });
          if (visibleCards.length > 0) {
            var links = visibleCards.map(function(c) { return c.querySelector('h2 a'); }).filter(Boolean);
            if (links.length > 0) {
              links[0].focus();
            }
          }
        }
      });
    })();
  </script>
</body>
</html>
