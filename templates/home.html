<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Hub</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script>
    // Add no-js class for progressive enhancement
    document.documentElement.classList.remove('no-js');
  </script>
</head>
<body class="no-js">
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <header role="banner">
    <div class="container">
      <h1><a href="/">Learning Hub</a></h1>
      <p class="tagline">Your personal library of knowledge</p>
    </div>
  </header>
  
  <main id="main-content" class="container" role="main">
    <section class="search-section" aria-label="Search courses">
      <label for="search-input" class="visually-hidden">Search courses</label>
      <input 
        type="text" 
        id="search-input" 
        class="search-input" 
        placeholder="Search courses by title, description, tags, or category..."
        aria-label="Search courses by title, description, tags, or category"
      >
    </section>
    
    <section class="courses-grid" id="courses-grid" aria-label="Course list">
      {{COURSE_CARDS}}
    </section>
  </main>
  
  <footer role="contentinfo">
    <div class="container">
      <p>Learning Hub — A curated collection of Teach sessions</p>
    </div>
  </footer>
  
  <script>
    // Client-side search functionality (progressive enhancement)
    (function() {
      const searchInput = document.getElementById('search-input');
      const coursesGrid = document.getElementById('courses-grid');
      const courseCards = coursesGrid.querySelectorAll('.course-card');
      
      searchInput.addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase().trim();
        
        courseCards.forEach(card => {
          const searchableText = card.dataset.searchText || '';
          const isVisible = !query || searchableText.includes(query);
          card.style.display = isVisible ? '' : 'none';
        });
        
        // Update no results message
        const visibleCards = Array.from(courseCards).filter(c => c.style.display !== 'none');
        let noResults = coursesGrid.querySelector('.no-results');
        
        if (visibleCards.length === 0 && query) {
          if (!noResults) {
            noResults = document.createElement('div');
            noResults.className = 'no-results';
            noResults.setAttribute('role', 'status');
            noResults.textContent = 'No courses match your search.';
            coursesGrid.appendChild(noResults);
          }
        } else if (noResults) {
          noResults.remove();
        }
      });
    })();
  </script>
</body>
</html>
